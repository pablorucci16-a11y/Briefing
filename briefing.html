<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #F5F3EE; --surface: #FDFCFA; --border: rgba(0,0,0,0.08);
    --text: #1A1814; --text-2: #6B6760; --text-3: #A09D99; --accent: #2B5CE6;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 0 0 4rem; }
  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 2rem 1.25rem 1.5rem; }
  .header-date { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); font-weight: 500; margin-bottom: 6px; }
  .header-greeting { font-family: 'DM Serif Display', serif; font-size: 32px; line-height: 1.15; color: var(--text); margin-bottom: 4px; }
  .header-sub { font-size: 14px; color: var(--text-2); }
  .section { padding: 1.25rem 1.25rem 0; }
  .section-label { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); margin-bottom: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 10px; }
  .clima-main { padding: 1.25rem; display: flex; align-items: flex-start; justify-content: space-between; }
  .clima-ciudad { font-size: 13px; color: var(--text-2); margin-bottom: 4px; }
  .clima-temp { font-family: 'DM Serif Display', serif; font-size: 52px; line-height: 1; color: var(--text); }
  .clima-desc { font-size: 13px; color: var(--text-2); margin-top: 6px; }
  .clima-minmax { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .clima-icon-big { font-size: 48px; line-height: 1; }
  .clima-horas { display: flex; border-top: 1px solid var(--border); overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .clima-horas::-webkit-scrollbar { display: none; }
  .hora-item { flex: 1; min-width: 52px; text-align: center; padding: 10px 6px; border-right: 1px solid var(--border); }
  .hora-item:last-child { border-right: none; }
  .hora-time { font-size: 11px; color: var(--text-3); }
  .hora-icon { font-size: 18px; margin: 4px 0; }
  .hora-temp { font-size: 13px; font-weight: 500; }
  .clima-semana { border-top: 1px solid var(--border); }
  .dia-row { display: flex; align-items: center; padding: 9px 1.25rem; gap: 10px; border-bottom: 1px solid var(--border); }
  .dia-row:last-child { border-bottom: none; }
  .dia-nombre { font-size: 13px; width: 32px; color: var(--text); }
  .dia-icon { font-size: 15px; width: 18px; text-align: center; }
  .dia-min { font-size: 12px; color: var(--text-3); width: 22px; text-align: right; }
  .dia-bar-wrap { flex: 1; height: 3px; background: var(--border); border-radius: 2px; }
  .dia-bar { height: 3px; border-radius: 2px; background: linear-gradient(to right, #85B7EB, #EF9F27); }
  .dia-max { font-size: 12px; font-weight: 500; width: 22px; text-align: right; }
  .evento { display: flex; align-items: stretch; padding: 11px 1.25rem; gap: 12px; border-bottom: 1px solid var(--border); }
  .evento:last-child { border-bottom: none; }
  .evento-bar { width: 3px; border-radius: 2px; flex-shrink: 0; }
  .evento-hora { font-size: 11px; color: var(--text-3); margin-bottom: 2px; }
  .evento-titulo { font-size: 14px; font-weight: 500; color: var(--text); }
  .evento-lugar { font-size: 12px; color: var(--text-2); margin-top: 2px; }
  .loading { padding: 2rem 1.25rem; text-align: center; color: var(--text-3); font-size: 14px; }
  .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-day { padding: 1.5rem 1.25rem; text-align: center; color: var(--text-3); font-size: 14px; font-style: italic; }
  .refresh-row { padding: 1rem 1.25rem 0; display: flex; justify-content: flex-end; }
  .refresh-btn { font-size: 12px; color: var(--text-3); background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .login-btn { display: block; width: calc(100% - 2.5rem); margin: 1rem 1.25rem; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 12px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; cursor: pointer; text-align: center; text-decoration: none; }

  /* NOTICIAS */
  .noticia { display: flex; flex-direction: column; padding: 13px 1.25rem; gap: 6px; border-bottom: 1px solid var(--border); }
  .noticia:last-child { border-bottom: none; }
  .noticia-header { display: flex; align-items: center; gap: 8px; }
  .noticia-tag { font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 7px; border-radius: 20px; white-space: nowrap; }
  .noticia-titulo { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.35; }
  .noticia-resumen { font-size: 13px; color: var(--text-2); line-height: 1.5; }
  .noticia-footer { display: flex; align-items: center; justify-content: flex-end; margin-top: 2px; }
  .noticia-claude-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; padding: 0; text-decoration: none; opacity: 0.8; transition: opacity 0.15s; }
  .noticia-claude-btn:hover { opacity: 1; }
  .noticia-claude-btn svg { flex-shrink: 0; }
  .noticias-footer { padding: 10px 1.25rem; font-size: 11px; color: var(--text-3); border-top: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }
  .noticias-footer-dot { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; flex-shrink: 0; }

  /* TAG COLORS */
  .tag-economia   { background: #FEF3C7; color: #92400E; }
  .tag-politica   { background: #FCE7F3; color: #9D174D; }
  .tag-foodtech   { background: #D1FAE5; color: #065F46; }
  .tag-ia         { background: #EDE9FE; color: #5B21B6; }
  .tag-mundo      { background: #DBEAFE; color: #1E40AF; }
  .tag-futbol     { background: #DCFCE7; color: #166534; }
  .tag-otro       { background: #F3F4F6; color: #374151; }

  .noticias-error { padding: 1.25rem; text-align: center; color: var(--text-3); font-size: 13px; }
  .noticias-retry { margin-top: 10px; font-size: 12px; color: var(--accent); background: none; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; }
</style>

function formatDate(d) {
  return `${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]} ${d.getFullYear()}`;
}

function getStoredToken() {
  const token = sessionStorage.getItem('gcal_token');
  const expiry = sessionStorage.getItem('gcal_expiry');
  if (token && expiry && Date.now() < parseInt(expiry)) return token;
  return null;
}

function storeToken(token, expiresIn) {
  sessionStorage.setItem('gcal_token', token);
  sessionStorage.setItem('gcal_expiry', Date.now() + expiresIn * 1000);
}

function redirectToGoogle() {
  const state = Math.random().toString(36).substring(2);
  sessionStorage.setItem('oauth_state', state);
  const params = new URLSearchParams({
    client_id: CLIENT_ID, redirect_uri: REDIRECT_URI, response_type: 'token',
    scope: SCOPE, state: state, include_granted_scopes: 'true'
  });
  window.location.href = `${AUTH_URL}?${params.toString()}`;
}

function parseTokenFromHash() {
  const hash = window.location.hash.substring(1);
  if (!hash) return null;
  const params = new URLSearchParams(hash);
  const token = params.get('access_token');
  const expiresIn = params.get('expires_in');
  const state = params.get('state');
  if (!token) return null;
  const savedState = sessionStorage.getItem('oauth_state');
  if (savedState && state !== savedState) return null;
  storeToken(token, parseInt(expiresIn) || 3600);
  window.history.replaceState({}, document.title, window.location.pathname);
  return token;
}

async function reverseGeocode(lat, lon) {
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);
    const d = await r.json();
    return d.address.city || d.address.town || d.address.village || 'Mi ubicación';
  } catch(e) { return 'Mi ubicación'; }
}

async function getWeather(lat, lon) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weathercode,windspeed_10m,apparent_temperature&hourly=temperature_2m,weathercode&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=6`;
  const r = await fetch(url);
  return await r.json();
}

function renderClima(wx, cityName) {
  const c = wx.current;
  const daily = wx.daily;
  const hourly = wx.hourly;
  const now = new Date();
  const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);

  const nextHours = [];
  let lastAddedHour = -99;
  for (let i = 0; i < hourly.time.length; i++) {
    const h = new Date(hourly.time[i]);
    if (h >= now && h <= endOfDay && nextHours.length < 6) {
      const hh = h.getHours();
      if (hh - lastAddedHour >= 3) {
        nextHours.push({ time: hh + 'h', icon: WMO[hourly.weathercode[i]] || '🌡️', temp: Math.round(hourly.temperature_2m[i]) });
        lastAddedHour = hh;
      }
    }
  }

  const maxTemps = daily.temperature_2m_max;
  const minTemps = daily.temperature_2m_min;
  const globalMax = Math.max(...maxTemps);
  const globalMin = Math.min(...minTemps);

  const horasHTML = nextHours.length > 0
    ? nextHours.map(h => `<div class="hora-item"><div class="hora-time">${h.time}</div><div class="hora-icon">${h.icon}</div><div class="hora-temp">${h.temp}°</div></div>`).join('')
    : '<div style="padding:12px 1.25rem;font-size:13px;color:var(--text-3)">Sin más horas disponibles hoy</div>';

  let semanaHTML = '';
  for (let i = 1; i < Math.min(daily.time.length, 6); i++) {
    const d = new Date(daily.time[i] + 'T12:00:00');
    const range = globalMax - globalMin || 1;
    const pct = Math.round((maxTemps[i] - globalMin) / range * 80 + 10);
    semanaHTML += `<div class="dia-row"><div class="dia-nombre">${DIAS_SHORT[d.getDay()]}</div><div class="dia-icon">${WMO[daily.weathercode[i]] || '🌡️'}</div><div class="dia-min">${Math.round(minTemps[i])}°</div><div class="dia-bar-wrap"><div class="dia-bar" style="width:${pct}%"></div></div><div class="dia-max">${Math.round(maxTemps[i])}°</div></div>`;
  }

  document.getElementById('clima-card').innerHTML = `
    <div class="clima-main">
      <div>
        <div class="clima-ciudad">📍 ${cityName}</div>
        <div class="clima-temp">${Math.round(c.temperature_2m)}°</div>
        <div class="clima-desc">${WMO_DESC[c.weathercode] || ''}</div>
        <div class="clima-minmax">Sensación ${Math.round(c.apparent_temperature)}° · Viento ${Math.round(c.windspeed_10m)} km/h · Máx ${Math.round(maxTemps[0])}° Mín ${Math.round(minTemps[0])}°</div>
      </div>
      <div class="clima-icon-big">${WMO[c.weathercode] || '🌡️'}</div>
    </div>
    <div class="clima-horas">${horasHTML}</div>
    <div class="clima-semana">${semanaHTML}</div>`;
}

async function getCalendarEvents(token) {
  const now = new Date();
  const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0).toISOString();
  const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59).toISOString();

  const calListResp = await fetch('https://www.googleapis.com/calendar/v3/users/me/calendarList', {
    headers: { Authorization: `Bearer ${token}` }
  });
  const calList = await calListResp.json();
  if (calList.error) throw new Error(calList.error.message);
  const calendars = calList.items || [];

  const allEvents = [];
  for (const cal of calendars) {
    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal.id)}/events?timeMin=${startOfDay}&timeMax=${endOfDay}&singleEvents=true&orderBy=startTime`;
    const resp = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    const data = await resp.json();
    for (const ev of (data.items || [])) {
      const colorId = ev.colorId || cal.colorId;
      const color = GCAL_COLOR_HEX[colorId] || cal.backgroundColor || '#4285F4';
      const todoElDia = !!ev.start.date;
      const horaInicio = todoElDia ? '' : new Date(ev.start.dateTime).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
      const horaFin = todoElDia ? '' : new Date(ev.end.dateTime).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
      allEvents.push({ titulo: ev.summary || '(Sin título)', hora_inicio: horaInicio, hora_fin: horaFin, lugar: ev.location || null, color, todo_el_dia: todoElDia, sortKey: todoElDia ? '00:00' : horaInicio });
    }
  }
  allEvents.sort((a, b) => a.sortKey.localeCompare(b.sortKey));
  return allEvents;
}

function renderCalendar(eventos) {
  const calCard = document.getElementById('cal-card');
  if (!eventos || eventos.length === 0) {
    calCard.innerHTML = '<div class="empty-day">Sin eventos para hoy 🎉</div>';
    document.getElementById('header-sub').textContent = 'Día libre — sin eventos agendados';
    return;
  }
  document.getElementById('header-sub').textContent = `${eventos.length} evento${eventos.length > 1 ? 's' : ''} hoy`;
  calCard.innerHTML = eventos.map(ev => {
    const hora = ev.todo_el_dia ? 'Todo el día' : (ev.hora_inicio + (ev.hora_fin ? ' – ' + ev.hora_fin : ''));
    const lugar = ev.lugar ? `<div class="evento-lugar">📍 ${ev.lugar}</div>` : '';
    return `<div class="evento"><div class="evento-bar" style="background:${ev.color}"></div><div style="flex:1"><div class="evento-hora">${hora}</div><div class="evento-titulo">${ev.titulo}</div>${lugar}</div></div>`;
  }).join('');
}

};

function getNoticiasKey() {
  const hoy = new Date();
  return `noticias_${hoy.getFullYear()}_${hoy.getMonth()}_${hoy.getDate()}`;
}

function getCachedNoticias() {
  try {
    const cached = localStorage.getItem(getNoticiasKey());
    if (cached) return JSON.parse(cached);
  } catch(e) {}
  return null;
}

function setCachedNoticias(data) {
  try {
    // Limpiar caché de días anteriores
    Object.keys(localStorage).forEach(k => {
      if (k.startsWith('noticias_') && k !== getNoticiasKey()) localStorage.removeItem(k);
    });
    localStorage.setItem(getNoticiasKey(), JSON.stringify(data));
  } catch(e) {}
}

async function fetchNoticias() {
  // Verificar caché del día
  const cached = getCachedNoticias();
  if (cached) {
    renderNoticias(cached, true);
    return;
  }

  const today = new Date().toLocaleDateString('es-AR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

  const prompt = `Hoy es ${today}. Buscá las noticias más importantes de las últimas 24 horas en estas 6 categorías y devolvé entre 5 y 12 noticias en total. Incluí todas las que tengan peso real — no te limites si hay mucho para cubrir.

1. Economía argentina (dólar, inflación, BCRA, bonos, macro)
2. Política argentina (gobierno, congreso, provincias, elecciones)
3. Food tech, nutrición y salud (tendencias globales, innovación en alimentos, salud)
4. IA y tecnología (lanzamientos, avances, empresas tech)
5. Noticias del mundo relevantes (geopolítica, economía global, eventos importantes)
6. Fútbol argentino (resultados, partidos, fichajes, Selección, River, Boca, torneos)

Respondé SOLO con un JSON válido, sin texto adicional, sin bloques de código, con esta estructura exacta:
{
  "noticias": [
    {
      "titulo": "Título claro y directo de la noticia",
      "resumen": "Una sola oración explicando el contexto y por qué importa. Máximo 20 palabras.",
      "categoria": "economia" | "politica" | "foodtech" | "ia" | "mundo" | "futbol",
      "query_claude": "Pregunta específica y concreta para profundizar en esta noticia, como si la hiciera un lector interesado"
    }
  ],
  "generado_a": "HH:MM"
}

Reglas:
- El título debe ser informativo, no clickbait
- El resumen agrega contexto que el título no da
- Seleccioná las noticias más impactantes e importantes del día
- Si no hay noticias frescas en alguna categoría, priorizá las de otras
- query_claude debe ser una pregunta directa sobre esa noticia puntual, no genérica
- generado_a es la hora actual en formato HH:MM`;

  try {
    const response = await fetch('https://script.google.com/macros/s/AKfycbwkBUpqbpqojqNyHeiJNUP2rqdmB7tJzSuZIhHewY_LxmPg4lPI30e9u_IT5LbZ6CPG/exec', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 2000,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await response.json();

    // Extraer texto de la respuesta (puede haber tool_use blocks intermedios)
    let jsonText = '';
    for (const block of (data.content || [])) {
      if (block.type === 'text') {
        jsonText = block.text;
        break;
      }
    }

    // Si el modelo usó web_search necesitamos una segunda vuelta
    const hasToolUse = (data.content || []).some(b => b.type === 'tool_use');
    if (hasToolUse && !jsonText) {
      // El modelo buscó pero no respondió aún — segunda vuelta con el resultado
      const toolResults = (data.content || [])
        .filter(b => b.type === 'tool_result' || b.type === 'tool_use')
        .map(b => b);

      // Armar historial para segunda vuelta
      const followUp = await fetch('https://script.google.com/macros/s/AKfycbwkBUpqbpqojqNyHeiJNUP2rqdmB7tJzSuZIhHewY_LxmPg4lPI30e9u_IT5LbZ6CPG/exec', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 2000,
          tools: [{ type: 'web_search_20250305', name: 'web_search' }],
          messages: [
            { role: 'user', content: prompt },
            { role: 'assistant', content: data.content },
          ]
        })
      });
      const data2 = await followUp.json();
      for (const block of (data2.content || [])) {
        if (block.type === 'text') { jsonText = block.text; break; }
      }
    }

    if (!jsonText) throw new Error('Sin respuesta de texto');

    // Limpiar posibles backticks
    const clean = jsonText.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);

    if (!parsed.noticias || !Array.isArray(parsed.noticias)) throw new Error('Formato inválido');

    setCachedNoticias(parsed);
    renderNoticias(parsed, false);

  } catch(err) {
    console.error('Error noticias:', err);
    renderNoticiasError();
  }
}

function renderNoticias(data, fromCache) {
  const card = document.getElementById('noticias-card');
  const noticias = data.noticias || [];

  if (noticias.length === 0) {
    card.innerHTML = '<div class="noticias-error">No se encontraron noticias para hoy.</div>';
    return;
  }

  const noticiasHTML = noticias.map(n => {
    const cat = n.categoria || 'otro';
    const tagClass = TAG_CLASSES[cat] || TAG_CLASSES.otro;
    const tagLabel = TAG_LABELS[cat] || cat;
    const claudeUrl = n.query_claude
      ? `https://claude.ai/new?q=${encodeURIComponent(n.query_claude)}`
      : `https://claude.ai/new?q=${encodeURIComponent('Contame más sobre: ' + n.titulo)}`;
    return `
      <div class="noticia">
        <div class="noticia-header">
          <span class="noticia-tag ${tagClass}">${tagLabel}</span>
        </div>
        <div class="noticia-titulo">${escapeHtml(n.titulo)}</div>
        <div class="noticia-resumen">${escapeHtml(n.resumen)}</div>
        <div class="noticia-footer">
          <a class="noticia-claude-btn" href="${claudeUrl}" target="_blank" rel="noopener">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
            Saber más en Claude
          </a>
        </div>
      </div>`;
  }).join('');

  const hora = data.generado_a || '—';
  const cacheLabel = fromCache ? 'Cargado desde caché' : `Actualizado hoy a las ${hora}`;

  card.innerHTML = noticiasHTML + `
    <div class="noticias-footer">
      <div class="noticias-footer-dot"></div>
      <span>${cacheLabel} · Fuente: búsqueda web</span>
    </div>`;
}

function renderNoticiasError() {
  const card = document.getElementById('noticias-card');
  card.innerHTML = `
    <div class="noticias-error">
      No se pudieron cargar las noticias de hoy.
      <br>
      <button class="noticias-retry" onclick="fetchNoticias()">↻ Reintentar</button>
    </div>`;
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ─────────────────────────────────────────────────────────────────────────────

async function loadClima() {
  return new Promise(resolve => {
    navigator.geolocation.getCurrentPosition(
      async pos => {
        const { latitude: lat, longitude: lon } = pos.coords;
        const [city, wx] = await Promise.all([reverseGeocode(lat, lon), getWeather(lat, lon)]);
        renderClima(wx, city);
        resolve();
      },
      async () => {
        const wx = await getWeather(-34.6037, -58.3816);
        renderClima(wx, 'Buenos Aires');
        resolve();
      },
      { timeout: 8000, maximumAge: 300000 }
    );
  });
}

async function loadCalendar(token) {
  try {
    const eventos = await getCalendarEvents(token);
    renderCalendar(eventos);
  } catch(e) {
    sessionStorage.removeItem('gcal_token');
    sessionStorage.removeItem('gcal_expiry');
    showLoginButton();
  }
}

function refresh() {
  // Al refrescar manualmente, borrar caché de noticias también
  localStorage.removeItem(getNoticiasKey());
  sessionStorage.removeItem('gcal_token');
  sessionStorage.removeItem('gcal_expiry');
  document.getElementById('noticias-card').innerHTML = '<div class="loading"><div class="spinner"></div>Buscando noticias...</div>';
  init();
}

async function init() {
  document.getElementById('header-date').textContent = formatDate(new Date());
  document.getElementById('clima-card').innerHTML = '<div class="loading"><div class="spinner"></div>Detectando ubicación...</div>';
  document.getElementById('cal-card').innerHTML = '<div class="loading"><div class="spinner"></div>Cargando eventos...</div>';

  const tokenFromHash = parseTokenFromHash();
  const token = tokenFromHash || getStoredToken();

  // Clima, calendario y noticias en paralelo
  const promises = [loadClima(), fetchNoticias()];
  if (token) {
    promises.push(loadCalendar(token));
  } else {
    showLoginButton();
  }

  await Promise.all(promises);
}

init();
</script>
